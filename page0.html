<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فضاء المعرفة</title>
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body>
  <header class="bg-primary text-light text-center p-3 m-3 pt-3">
 <img src="blue face.jpeg" alt="Logo" style="height: 120px; width: 120px; margin: auto;" class="rounded-circle ms-5 mb-4">
  <h1>فــــضــــــاء  الــــمــــعــــرفــــة</h1>
  </header>
    <main class="d-flex justify-content-center align-items-center vh-100">
        <div class="card w-50">
    <div class="card-header text-center">
      تسجيل الإشتراك :
    </div>
    <div class="card-body mb-3">
        <div class="mb-3">
        <label class="form-label">إسم المستخدم:</label>
        <input type="text" class="form-control">
      </div> 
<div class="mb-3">
  <label for="birthdate" class="form-label">تاريخ الإزدياد:</label>
  <input type="date" class="form-control" id="birthdate">
</div>
<div class="mb-3">
  <label class="form-label d-block">الجنس:</label>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="gender" id="male" value="male">
    <label class="form-check-label" for="male">مذكر</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
    <label class="form-check-label" for="female">مؤنث</label>
  </div>
</div>
      <div class="mb-3">
        <label class="form-label">البريد الإلكتروني:</label>
        <input type="email" placeholder="أدخل  البريد الإلكتروني" class="form-control">
      </div>
    <div class="mb-3">
      <label for="password" class="form-label">كلمة السر :</label>
      <input type="password" class="form-control" id="password" placeholder="أدخل كلمة السر">
    </div>
     <div class="mb-3">
      <label for="password" class="form-label">تأكيد كلمة السر:</label>
      <input type="password" class="form-control" id="password">
    </div>
    <button type="submit" class="btn btn-warning w-100"><a href="page1.html" class="text-decoration-none text-reset">دخول</a></button>
  </form>
</main>
</body>
</html>
